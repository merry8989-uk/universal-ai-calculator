name = "nexus-calc-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

# Workers AI runs the model on Cloudflare — no API key needed anywhere.
[ai]
binding = "AI"

[vars]
# Preferred model. If Cloudflare retires it, the Worker automatically falls back
# to the other current models listed in worker.js.
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
