name = "nexus-calc-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

# The assistant runs on Sarvam AI. The key is a Worker secret, never a file:
#
#   npx wrangler secret put SARVAM_API_KEY --name nexus-calc-ai
#   npx wrangler secret put TAVILY_API_KEY --name nexus-calc-ai   (search)
#
# The deploy workflow sets it from the SARVAM_API_KEY repository secret, so the
# key lives in exactly two places — Sarvam's dashboard and GitHub's encrypted
# secrets — and in neither the app nor this repo.
#
# Workers AI is no longer used, so there is no [ai] binding here. Cloudflare's
# models were too small to hold a question in mind: a photograph of an exam
# paper came back as the marks line printed in its header.

[vars]
# Which Sarvam model answers. Overridable without a code change.
SARVAM_CHAT_MODEL = "sarvam-105b"
SARVAM_VISION_MODEL = "glm5.3-flash"

# The event warehouse: D1, which is SQLite on Cloudflare, so events can be
# counted and grouped with SQL. The deploy workflow creates the database and
# fills in its id, exactly as it does for the sync namespace below.
# [[d1_databases]]
# binding = "EVENTS"
# database_name = "nexus-events"
# database_id = "PLACEHOLDER"
#
# Reading the numbers needs a token: /stats and /dashboard refuse without it.
#   npx wrangler secret put STATS_TOKEN --name nexus-calc-ai

# Encrypted sync storage. The deploy workflow fills in the real namespace id
# from Cloudflare before deploying; if it cannot, the binding is left out and
# only the sync endpoints are disabled (the assistant keeps working).
# [[kv_namespaces]]
# binding = "NEXUS_SYNC"
# id = "PLACEHOLDER"
