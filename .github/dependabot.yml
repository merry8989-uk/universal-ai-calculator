# Keeps the things this app is built from up to date.
#
# A calculator is mostly arithmetic, so the risk is not in the maths — it is in
# the libraries underneath, and in the Actions that build the APK. Dependabot
# opens a pull request when something has a newer version, and the security
# alerts show which of those newer versions fix a known vulnerability.
version: 2

updates:
  # the Android app and the shared engine
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # The Worker has no npm dependencies at all — it is one JavaScript file with no
  # package.json, deployed by wrangler — so there is nothing here to watch. An
  # npm entry for that folder was added first and Dependabot failed on it, which
  # is the correct response to being pointed at a directory with no manifest.

  # the Actions that build and release the app
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
