name: Tests

# Runs the engine unit tests (formulas, unit conversions, scientific maths,
# matrix, statistics, converters, dates, programmer, calculus) on the JVM.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  # A pull request is exactly when a broken test should be caught, and the
  # workflow used to run only after the merge.
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build the watch app
        # So a break in :wear or :core is caught here, not at release time.
        run: ./gradlew --no-daemon :wear:assembleDebug :core:assemble

      - name: Lint
        # A lint error is a release blocker, and it was only ever found after the
        # tag. It runs here so it is found in review instead.
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build the release
        # R8, shrinking and the signing config exist only in the release variant.
        # A throwaway keystore is enough to prove they work; nothing is published.
        env:
          KEYSTORE_PATH: ci.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ci-throwaway
          KEY_ALIAS: ci
          KEY_PASSWORD: ci-throwaway
        run: |
          keytool -genkeypair -keystore ci.p12 -storetype PKCS12 \
            -alias ci -storepass ci-throwaway -keypass ci-throwaway \
            -dname "CN=CI" -keyalg RSA -keysize 2048 -validity 1
          ./gradlew --no-daemon assembleRelease

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the formula page works
        # FormulaPageTest reads the page; this runs it. A selector renamed or a
        # handler dropped loads fine and does nothing, and only this notices.
        run: |
          npm --prefix tools install --no-audit --no-fund
          node tools/check_page.mjs

      - name: Summarise results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skip = 0
          problems = []
          files = (glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
                   + glob.glob('core/build/test-results/test/*.xml'))
          for f in files:
              root = ET.parse(f).getroot()
              total += int(root.get('tests', 0))
              fail += int(root.get('failures', 0))
              err += int(root.get('errors', 0))
              skip += int(root.get('skipped', 0))
              for tc in root.iter('testcase'):
                  for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (bad.get('message') or '').strip().replace('\n', ' ')
                      problems.append(f"{tc.get('classname')}.{tc.get('name')} -> {msg[:300]}")
          print(f"TESTS: total={total} failures={fail} errors={err} skipped={skip}")
          for p in problems[:60]:
              print("FAIL:", p)
          if not problems:
              print("All engine tests passed.")
          PY
