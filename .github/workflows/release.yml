name: Release

# Build a signed release and publish it. Rule 3: publish only what actually
# builds, always as an installable update over the previous version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing — cannot sign a release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.p12

      - name: Build signed release
        env:
          KEYSTORE_PATH: release.p12
          KEYSTORE_TYPE: PKCS12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease :wear:assembleRelease

      - name: Name the assets by device
        # The updater used to take the first .apk in the release, and the watch
        # build is published next to the phone one, so a phone could be offered
        # the watch app. The name now says which device the file is for.
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/*.apk "release-assets/nexus-calc-phone-$version.apk"
          cp app/build/outputs/bundle/release/*.aab "release-assets/nexus-calc-phone-$version.aab"
          cp wear/build/outputs/apk/release/*.apk "release-assets/nexus-calc-wear-$version.apk"
          ls -l release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*

      - name: Remove keystore from runner
        if: always()
        run: rm -f release.p12
