name: Deploy AI Worker

# Deploys the Nexus Calc AI backend (Cloudflare Worker, Workers AI) from
# GitHub's runners, which can reach the Cloudflare API. Run it from the
# Actions tab. No model API key is needed — Workers AI runs on Cloudflare.
#
# Required repository secret:
#   CLOUDFLARE_API_TOKEN   — a Cloudflare API token with "Edit Cloudflare Workers"
# Optional repository secrets:
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_URL: https://nexus-calc-ai.br19shc39.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy the Worker
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          wrangler deploy
          # The Gemini key is no longer used now that the model runs on Workers AI.
          wrangler secret delete GEMINI_API_KEY || true

      - name: Smoke test the Worker
        run: |
          sleep 8
          echo "--- asking the deployed assistant ---"
          curl -sS --max-time 60 -X POST "$WORKER_URL" \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is 15 percent of 2400? Reply with one short line."}' \
            | tee /tmp/answer.json
          echo
          if grep -qi '"answer"' /tmp/answer.json; then
            echo "SMOKE TEST: PASS"
            python3 -c "import json;d=json.load(open('/tmp/answer.json'));print('model used:', d.get('model'));print('answer:', d.get('answer'))"
          else
            echo "SMOKE TEST: FAIL (no answer field)" >&2
            exit 1
          fi
