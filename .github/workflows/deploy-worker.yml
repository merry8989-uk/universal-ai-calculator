name: Deploy AI Worker

# Deploys the Nexus Calc AI backend (Cloudflare Worker, Workers AI) from
# GitHub's runners, which can reach the Cloudflare API. Run it from the
# Actions tab. No model API key is needed — Workers AI runs on Cloudflare.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — a Cloudflare API token with "Edit Cloudflare Workers"
#   SARVAM_API_KEY         — the Sarvam AI key the assistant runs on. It is
#                            pushed to the Worker as a secret on every deploy, so
#                            it never appears in this repo or in the app.
#   TAVILY_API_KEY         — the search key. Optional: without it the assistant
#                            falls back to DuckDuckGo and Wikipedia, which answer
#                            questions about ideas but not about today.
#   STATS_TOKEN            — the password for the event warehouse dashboard.
#                            Without it /stats and /dashboard refuse everything.
# Optional repository secrets:
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_URL: https://nexus-calc-ai.br19shc39.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Attach the sync storage, if the token allows it
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          ID="$(wrangler kv namespace list 2>/dev/null | python3 ../../tools/kv_namespace_id.py NEXUS_SYNC || true)"

          if [ -z "$ID" ]; then
            OUT="$(wrangler kv namespace create NEXUS_SYNC 2>&1 || true)"
            echo "$OUT"
            ID="$(printf '%s' "$OUT" | grep -oE '[a-f0-9]{32}' | head -1)"
          fi

          if [ -z "$ID" ]; then
            echo "::warning::Sync storage could not be set up, so encrypted sync stays off."
            echo "Add the 'Workers KV Storage: Edit' permission to CLOUDFLARE_API_TOKEN and run"
            echo "this workflow again to switch sync on. The assistant is unaffected."
            exit 0
          fi

          printf '\n[[kv_namespaces]]\nbinding = "NEXUS_SYNC"\nid = "%s"\n' "$ID" >> wrangler.toml
          echo "Sync storage attached (namespace $ID)."

      - name: Deploy the Worker
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          # The event warehouse. Created once, then reused; the id is written
          # into wrangler.toml so the binding survives the deploy.
          D1_ID="$(wrangler d1 list --json 2>/dev/null | python3 ../../tools/d1_id.py || true)"
          if [ -z "$D1_ID" ]; then
            echo "Creating the nexus-events database."
            OUT="$(wrangler d1 create nexus-events 2>&1 || true)"
            echo "$OUT"
            D1_ID="$(printf '%s' "$OUT" | sed -n 's/.*database_id *= *"\([^"]*\)".*/\1/p' | head -1)"
          fi
          if [ -n "$D1_ID" ]; then
            printf '\n[[d1_databases]]\nbinding = "EVENTS"\ndatabase_name = "nexus-events"\ndatabase_id = "%s"\n' "$D1_ID" >> wrangler.toml
            echo "Event warehouse attached (database $D1_ID)."
          else
            echo "::warning::Could not create the D1 database, so the event warehouse stays off."
          fi

          wrangler deploy
          # The Sarvam key is set from the repository secret, so the Worker always has
          # the current one and it is never written to a file.
          if [ -n "$SARVAM_API_KEY" ]; then
            printf '%s' "$SARVAM_API_KEY" | wrangler secret put SARVAM_API_KEY --name nexus-calc-ai
          else
            echo "::warning::SARVAM_API_KEY is not set — the assistant will not answer until it is."
          fi
          if [ -n "$TAVILY_API_KEY" ]; then
            printf '%s' "$TAVILY_API_KEY" | wrangler secret put TAVILY_API_KEY --name nexus-calc-ai
          else
            echo "::warning::TAVILY_API_KEY is not set — search falls back to DuckDuckGo and Wikipedia."
          fi
          if [ -n "$STATS_TOKEN" ]; then
            printf '%s' "$STATS_TOKEN" | wrangler secret put STATS_TOKEN --name nexus-calc-ai
          else
            echo "::warning::STATS_TOKEN is not set — the warehouse dashboard will refuse every request."
          fi
          # the old provider's key, if it was ever set here
          wrangler secret delete GEMINI_API_KEY || true

      - name: Smoke test the Worker
        run: |
          sleep 8
          echo "--- asking the deployed assistant ---"
          curl -sS --max-time 60 -X POST "$WORKER_URL" \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is 15 percent of 2400? Reply with one short line."}' \
            | tee /tmp/answer.json
          echo
          echo "--- ping (the app measures its round trip with this) ---"
          curl -sS --max-time 30 -X POST "$WORKER_URL" -H 'Content-Type: application/json' \
            -d '{"ping":true}' | tee /tmp/ping.json
          echo
          grep -q '"pong":true' /tmp/ping.json && echo "PING: PASS" || { echo "PING: FAIL" >&2; exit 1; }

          echo "--- sync storage ---"
          SLOT="$(python3 -c "import hashlib;print(hashlib.sha256(b'nexuscalc-sync-v1|'+b'ci-smoke-code').hexdigest())")"
          curl -sS --max-time 30 -X POST "$WORKER_URL" -H 'Content-Type: application/json' \
            -d "{\"sync\":\"put\",\"slot\":\"$SLOT\",\"blob\":\"smoke-test-blob\"}" | tee /tmp/sync_put.json
          echo
          curl -sS --max-time 30 -X POST "$WORKER_URL" -H 'Content-Type: application/json' \
            -d "{\"sync\":\"get\",\"slot\":\"$SLOT\"}" | tee /tmp/sync_get.json
          echo

          if grep -qi '"answer"' /tmp/answer.json; then
            echo "SMOKE TEST: PASS"
            python3 -c "import json;d=json.load(open('/tmp/answer.json'));print('model used:', d.get('model'));print('answer:', d.get('answer'))"
          else
            echo "SMOKE TEST: FAIL (no answer field)" >&2
            exit 1
          fi
