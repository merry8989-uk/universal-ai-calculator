name: Deploy AI Worker

# Deploys the Nexus Calc AI backend (Cloudflare Worker) from GitHub's runners,
# which can reach the Cloudflare API. Run it from the Actions tab.
#
# Required repository secret:
#   CLOUDFLARE_API_TOKEN   — a Cloudflare API token with "Edit Cloudflare Workers"
# Optional repository secrets (set automatically by the project owner):
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#   GEMINI_API_KEY         — the Gemini key, stored as a Worker secret
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy the Worker
        working-directory: backend/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          if [ -n "$GEMINI_KEY" ]; then
            printf '%s' "$GEMINI_KEY" | wrangler secret put GEMINI_API_KEY
          fi
          wrangler deploy
          echo "--- workers.dev URL ---"
          wrangler deployments list || true
