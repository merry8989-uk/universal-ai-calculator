name: Pages

# Publishes the public app page (docs/) to GitHub Pages on every push.
# Rule 5: the page documents every feature and ends with the @osintgram_io
# contact. Turn Pages on once: Settings -> Pages -> Source: GitHub Actions.
#
# The formula site is generated here rather than committed: the export test
# writes docs/formulas.json straight out of the app's own registry, and the
# Node check then runs the site's JavaScript engine over every one of those
# formulas and compares it with the answer the app produced. A site that
# computes something different from the app is worse than no site, so the
# deploy does not happen if they disagree.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The wrapper is not committed; the tests workflow generates it the same
      # way, so this does too rather than assuming it is there.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure the Gradle wrapper exists
        run: test -f gradlew || gradle wrapper --gradle-version 8.9

      - name: Build the formula file from the app's registry
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --tests "*FormulaExportTest*" --console=plain
          ls -la docs/formulas.json

      - name: Check the site against the app
        run: node tools/check_formulas.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
