name: Worker check

# Diagnoses the live AI Worker from a GitHub runner, which can reach the
# internet. Run it from the Actions tab. Nothing is written back to the repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Text question
        run: |
          echo "--- text question ---"
          curl -sS --max-time 60 -X POST "https://nexus-calc-ai.br19shc39.workers.dev" -H "Content-Type: application/json" -d '{"question":"What is 2+2? Answer on one line."}' | head -c 1500
          echo

      # The format the user asked for: the answers first, then the reasoning.
      - name: Answers come before the explanations
        run: |
          echo "--- format ---"
          python3 - <<'PY'
          import json, urllib.request
          body = json.dumps({
              "question": "Two questions. Q1: what is 15 percent of 240? Q2: which is larger, 3/4 or 4/5?",
          }).encode()
          req = urllib.request.Request(
              "https://nexus-calc-ai.br19shc39.workers.dev",
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "nexus-check/1.0"})
          with urllib.request.urlopen(req, timeout=180) as r:
              out = json.loads(r.read())
          text = out.get("answer") or ""
          print(text[:1200])
          first = text.upper().find("ANSWERS")
          expl = text.upper().find("EXPLANATIONS")
          if first >= 0 and expl > first:
              print("FORMAT CHECK: PASS")
          else:
              raise SystemExit("FORMAT CHECK: FAIL — no ANSWERS then EXPLANATIONS")
          PY

      # Not mathematics, and needs the live web.
      - name: A science question with a search
        run: |
          echo "--- search ---"
          python3 - <<'PY'
          import json, urllib.request
          body = json.dumps({
              "question": "What does photosynthesis produce, and in which part of the plant cell does it happen?",
          }).encode()
          req = urllib.request.Request(
              "https://nexus-calc-ai.br19shc39.workers.dev",
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "nexus-check/1.0"})
          with urllib.request.urlopen(req, timeout=240) as r:
              out = json.loads(r.read())
          print("model:", out.get("model"))
          print("searched:", out.get("searched"))
          text = out.get("answer") or ""
          print(text[:1200])
          if "chloroplast" in text.lower() and "glucose" in text.lower() or "oxygen" in text.lower():
              print("SUBJECT CHECK: PASS")
          else:
              raise SystemExit("SUBJECT CHECK: FAIL")
          PY

      # Search is only proved by a question whose answer is not in any model's
      # memory: something that happened today.
      - name: A question that needs today's news
        run: |
          echo "--- live search ---"
          python3 - <<'PY'
          import json, urllib.request
          body = json.dumps({
              "question": "What is the current price of one gram of 24 carat gold in India today?",
          }).encode()
          req = urllib.request.Request(
              "https://nexus-calc-ai.br19shc39.workers.dev",
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "nexus-check/1.0"})
          with urllib.request.urlopen(req, timeout=240) as r:
              out = json.loads(r.read())
          print("model:", out.get("model"))
          print("searched:", out.get("searched"))
          text = out.get("answer") or ""
          print(text[:900])
          if out.get("searched"):
              print("SEARCH CHECK: PASS — it looked something up")
          else:
              raise SystemExit("SEARCH CHECK: FAIL — it answered without searching")
          PY

      # A follow-up has to know what came before it, or the assistant is a search
      # box rather than a conversation.
      - name: A follow-up question remembers the first
        run: |
          echo "--- follow-up ---"
          python3 - <<'PY'
          import json, urllib.request
          body = json.dumps({
              "question": "And what is the second one squared?",
              "history": [
                  {"role": "user", "content": "I have two numbers, 7 and 9."},
                  {"role": "assistant", "content": "Understood: your numbers are 7 and 9."},
              ],
          }).encode()
          req = urllib.request.Request(
              "https://nexus-calc-ai.br19shc39.workers.dev",
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "nexus-check/1.0"})
          with urllib.request.urlopen(req, timeout=180) as r:
              out = json.loads(r.read())
          print("model:", out.get("model"))
          print("turns sent:", out.get("turns"))
          print(out.get("answer") or out)
          text = (out.get("answer") or "")
          if "81" in text:
              print("FOLLOW-UP CHECK: PASS")
          else:
              raise SystemExit("FOLLOW-UP CHECK: FAIL — it did not know the second number was 9")
          PY

      - name: Photo with 2+2 on it
        run: |
          echo "--- photo ---"
          printf '{"image":"%s"}' "$(cat tools/worker_check/photo.b64)" > /tmp/body.json
          curl -sS --max-time 90 -X POST "https://nexus-calc-ai.br19shc39.workers.dev" -H "Content-Type: application/json" --data @/tmp/body.json | head -c 4000
          echo

      # The bug this was written for: a photo of an exam paper came back as the
      # marks line printed in its header, because every picture went through the
      # expression reader. The right answer to question 4 of this paper is
      # D) n*pi + 5*pi/6.
      - name: A question about a photo of an exam paper
        run: |
          echo "--- exam paper, question 4 ---"
          python3 - <<'PY'
          import base64, json, urllib.request
          b64 = base64.b64encode(open("tools/worker_check/exam.jpg", "rb").read()).decode()
          body = json.dumps({
              "image": b64,
              "mode": "answer",
              "question": "Which option is correct for question number 4?",
          }).encode()
          # Cloudflare refuses a request with no browser-like agent (error 1010)
          req = urllib.request.Request(
              "https://nexus-calc-ai.br19shc39.workers.dev",
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "nexus-check/1.0"})
          with urllib.request.urlopen(req, timeout=180) as r:
              out = json.loads(r.read())
          print("model:", out.get("model"))
          print(out.get("answer") or out)
          if out.get("answer") and "5" in out["answer"]:
              print("EXAM CHECK: PASS")
          else:
              raise SystemExit("EXAM CHECK: FAIL")
          PY

      # The warehouse: send three events, then read them back as numbers.
      - name: The event warehouse
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          echo "--- warehouse ---"
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          BASE = "https://nexus-calc-ai.br19shc39.workers.dev"
          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          events = [
              {"schema_version": "1.0", "event_id": "evt_ci1", "event_name": "calculator.operation.completed",
               "category": "calc", "timestamp": now, "severity": "INFO",
               "app": {"name": "nexus-calc", "version": "2.4.0", "platform": "android"},
               "context": {"anonymous_install_id": "ci", "session_id": "ci"},
               "fields": {"status": "success", "duration_ms": "42"}},
              {"schema_version": "1.0", "event_id": "evt_ci2", "event_name": "ai.request.completed",
               "category": "ai", "timestamp": now, "severity": "INFO",
               "app": {"name": "nexus-calc", "version": "2.4.0", "platform": "android"},
               "context": {"anonymous_install_id": "ci", "session_id": "ci"},
               "fields": {"status": "success", "duration_ms": "1200", "verification": "mismatch"}},
              {"schema_version": "1.0", "event_id": "evt_ci3", "event_name": "ai.request.completed",
               "category": "ai", "timestamp": now, "severity": "INFO",
               "app": {"name": "nexus-calc", "version": "2.4.0", "platform": "android"},
               "context": {"anonymous_install_id": "ci", "session_id": "ci"},
               "fields": {"status": "success", "duration_ms": "900", "verification": "match"}},
          ]
          body = json.dumps({"events": events}).encode()
          req = urllib.request.Request(BASE + "/events", data=body,
                                       headers={"Content-Type": "application/json", "User-Agent": "nexus-check/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              print("ingest:", r.read().decode()[:200])

          token = os.environ.get("STATS_TOKEN", "")
          req = urllib.request.Request(BASE + "/stats?days=1",
                                       headers={"x-stats-token": token, "User-Agent": "nexus-check/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              d = json.loads(r.read())
          print("storage:", d.get("storage"))
          print("total:", d.get("total_events"))
          print("verification:", d.get("verification"))
          print("calculator:", d.get("calculator"))
          if d.get("total_events", 0) >= 3 and d.get("verification", {}).get("mismatch") == 1:
              print("WAREHOUSE CHECK: PASS")
          else:
              raise SystemExit("WAREHOUSE CHECK: FAIL")
          PY

      - name: Encrypted sync round trip
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/sync_roundtrip.py https://nexus-calc-ai.br19shc39.workers.dev

      - name: Whole-page transcription (the PDF path)
        run: |
          echo "--- page, text mode ---"
          printf '{"image":"%s","mode":"text"}' "$(cat tools/worker_check/page.b64)" > /tmp/p.json
          curl -sS --max-time 90 -X POST "https://nexus-calc-ai.br19shc39.workers.dev" -H "Content-Type: application/json" --data @/tmp/p.json | head -c 2000
          echo

      - name: Audio clip
        run: |
          echo "--- audio ---"
          printf '{"audio":"%s"}' "$(cat tools/worker_check/audio.b64)" > /tmp/abody.json
          curl -sS --max-time 90 -X POST "https://nexus-calc-ai.br19shc39.workers.dev" -H "Content-Type: application/json" --data @/tmp/abody.json | head -c 4000
          echo
