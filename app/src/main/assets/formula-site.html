<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Formulas</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --text:#e6edf3; --muted:#9198a1; --accent:#4f9cf0;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.5;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding-bottom:80px; }

  .top { position:sticky; top:0; z-index:10; background:var(--bg);
         border-bottom:1px solid var(--border); padding:12px 14px 8px; }
  .head { display:flex; align-items:baseline; justify-content:space-between; }
  h1 { font-size:1.25rem; margin:0; }
  .sub { color:var(--muted); font-size:.75rem; }
  .back { color:var(--accent); background:none; border:0; font-size:.9rem; padding:4px 0; }

  input[type=search] { width:100%; margin-top:10px; padding:11px 13px; border-radius:10px;
      border:1px solid var(--border); background:var(--panel); color:var(--text);
      font-size:.95rem; -webkit-appearance:none; }
  input[type=search]:focus { outline:2px solid var(--accent); outline-offset:1px; }

  .chips { display:flex; gap:7px; overflow-x:auto; margin-top:9px; padding-bottom:3px;
           scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:5px 11px; border-radius:999px; border:1px solid var(--border);
          background:var(--panel); color:var(--muted); font-size:.78rem; white-space:nowrap; }
  .chip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }

  .list { padding:10px 12px 0; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px;
          padding:14px; margin-bottom:10px; }
  .card h2 { font-size:.98rem; margin:0 0 8px; font-weight:600; }
  .formula { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92rem;
             background:var(--panel2); border-radius:10px; padding:10px 12px;
             white-space:pre-wrap; word-break:break-word;
             -webkit-user-select:text; user-select:text; }
  .meta { display:flex; gap:8px; align-items:center; margin-top:8px;
          font-size:.72rem; color:var(--muted); flex-wrap:wrap; }
  .badge { padding:1px 8px; border-radius:999px; font-size:.68rem; }
  .badge.calc { color:var(--ok); background:#2ea04322; }
  .badge.ref { color:var(--warn); background:#d2992222; }

  .inputs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .field label { display:block; font-size:.68rem; color:var(--muted); margin-bottom:3px; }
  .field input { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
                 background:var(--bg); color:var(--text); font-size:.92rem;
                 font-family:ui-monospace,SFMono-Regular,Menlo,monospace; -webkit-appearance:none; }
  .field input:focus { outline:2px solid var(--accent); outline-offset:1px; }

  .answer { margin-top:10px; border-radius:10px; background:var(--panel2); padding:11px 12px; }
  .answer .label { color:var(--muted); font-size:.7rem; }
  .answer .value { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:1.35rem;
                   color:var(--accent); -webkit-user-select:text; user-select:text; }
  .answer.bad .value { font-size:.9rem; color:var(--bad); }

  .steps { margin:10px 0 0; padding:0; list-style:none; }
  .steps li { display:flex; gap:8px; padding:5px 0; border-top:1px solid var(--border);
              font-size:.8rem; }
  .steps li:first-child { border-top:0; }
  .steps .n { flex:0 0 18px; color:var(--muted); font-size:.72rem; padding-top:2px; }
  .steps .body { flex:1; -webkit-user-select:text; user-select:text; }
  .steps .d { color:var(--muted); font-size:.7rem; display:block; }
  .steps .e { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-word; }
  .steps .r { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); }

  .hint { color:var(--muted); font-size:.72rem; margin-top:8px; }
  .open-tool { margin-top:10px; padding:9px 14px; border-radius:9px; border:0;
               background:var(--accent); color:#fff; font-size:.85rem; font-weight:600; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:.9rem; }
  .more { display:block; width:100%; margin:14px 0 30px; padding:12px; border-radius:10px;
          background:var(--accent); color:#fff; border:0; font-size:.9rem; font-weight:600; }
</style>
</head>
<body>

<div class="top">
  <div class="head">
    <div>
      <h1>Formulas</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <button class="back" onclick="Android.back()">Back</button>
  </div>
  <input type="search" id="q" placeholder="Search — try cos, Bayes, interest" autocomplete="off">
  <div class="chips" id="cats"></div>
</div>

<div class="list" id="list"></div>
<div class="empty" id="empty" hidden>Nothing matches that search.</div>
<button class="more" id="more" hidden>Show more</button>

<script>
(function () {
  'use strict';

  var PAGE = 30;
  var all = [];
  var shown = PAGE;
  var query = '';
  var category = null;
  var onlyWorkable = false;

  var listEl = document.getElementById('list');
  var catsEl = document.getElementById('cats');
  var subEl = document.getElementById('sub');
  var emptyEl = document.getElementById('empty');
  var moreEl = document.getElementById('more');
  var qEl = document.getElementById('q');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function canWork(f) { return f.workable; }

  function matches(f) {
    if (onlyWorkable && !canWork(f)) return false;
    if (category && f.category !== category) return false;
    if (!query) return true;
    var q = query.toLowerCase();
    return (f.title + ' ' + f.printed + ' ' + f.category).toLowerCase().indexOf(q) >= 0;
  }

  function cardHtml(f) {
    var h = '<div class="card" data-id="' + esc(f.id) + '">';
    h += '<h2>' + esc(f.title) + '</h2>';
    // the formula is text the reader owns: hold it and the phone offers Copy and Share
    h += '<div class="formula">' + esc(f.printed) + '</div>';
    h += '<div class="meta"><span class="badge ' + (canWork(f) ? 'calc' : 'ref') + '">' +
         (canWork(f) ? 'works it out' : 'to read') + '</span><span>' + esc(f.category) + '</span></div>';

    if (canWork(f)) {
      h += '<div class="inputs">';
      f.inputs.forEach(function (inp) {
        h += '<div class="field"><label>' + esc(inp.label) + '</label>' +
             '<input type="number" step="any" inputmode="decimal" data-k="' + esc(inp.id) + '" value="' + inp.sample + '"></div>';
      });
      h += '</div>';
      h += '<div class="answer"><span class="label">' + esc(f.out) +
           (f.unit ? ' (' + esc(f.unit) + ')' : '') + '</span>' +
           '<div class="value">—</div></div>';
      h += '<ol class="steps"></ol>';
      h += '<div class="hint">Hold the formula or any step to copy or share it.</div>';
    } else if (f.tool) {
      // the app can work this one out, just not on this page
      h += '<button class="open-tool" data-tool="' + esc(f.tool) + '">Open the calculator \u2192</button>';
    }
    h += '</div>';
    return h;
  }

  function work(card, f) {
    var pairs = [];
    card.querySelectorAll('input[data-k]').forEach(function (inp) {
      pairs.push(encodeURIComponent(inp.getAttribute('data-k')) + '=' +
                 encodeURIComponent(inp.value === '' ? '0' : inp.value));
    });
    var raw = Android.calculate(f.id, pairs.join('&'));
    var r;
    try { r = JSON.parse(raw); } catch (e) { return; }

    var box = card.querySelector('.answer');
    var val = card.querySelector('.answer .value');
    var steps = card.querySelector('.steps');
    steps.innerHTML = '';

    if (r.ok) {
      box.classList.remove('bad');
      val.textContent = (r.exact || '') + (r.unit ? ' ' + r.unit : '');
    } else {
      box.classList.add('bad');
      val.textContent = r.error || 'That did not work.';
    }

    // the working: how the answer was reached, not just what it is
    (r.steps || []).forEach(function (s, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="n">' + (i + 1) + '</span>' +
        '<span class="body"><span class="d">' + esc(s.d) + '</span>' +
        '<span class="e">' + esc(s.e) + '</span>' +
        (s.r ? '<span class="r"> = ' + esc(s.r) + '</span>' : '') +
        '</span>';
      steps.appendChild(li);
    });
    (r.warnings || []).forEach(function (w) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="n">!</span><span class="body"><span class="d">' +
                     esc(w) + '</span></span>';
      steps.appendChild(li);
    });
  }

  function render() {
    var filtered = all.filter(matches);
    var slice = filtered.slice(0, shown);
    var html = '';
    for (var i = 0; i < slice.length; i++) html += cardHtml(slice[i]);
    listEl.innerHTML = html;

    listEl.querySelectorAll('.open-tool').forEach(function (b) {
      b.addEventListener('click', function () {
        Android.openTool(b.getAttribute('data-tool'));
      });
    });

    var cards = listEl.querySelectorAll('.card');
    for (var c = 0; c < cards.length; c++) {
      (function (card, f) {
        if (!canWork(f)) return;
        work(card, f);
        card.querySelectorAll('input[data-k]').forEach(function (inp) {
          inp.addEventListener('input', function () { work(card, f); });
        });
      })(cards[c], slice[c]);
    }

    emptyEl.hidden = filtered.length !== 0;
    moreEl.hidden = filtered.length <= shown;
    moreEl.textContent = 'Show more (' + Math.max(0, filtered.length - shown) + ' left)';
    subEl.textContent = filtered.length + ' of ' + all.length + ' formulas' +
      (category ? ' · ' + category : '');
  }

  function buildChips() {
    var counts = {};
    all.forEach(function (f) { counts[f.category] = (counts[f.category] || 0) + 1; });
    var workable = all.filter(canWork).length;
    var names = Object.keys(counts).sort();
    var html = '<button class="chip" data-c="" data-w="1" aria-pressed="false">Can work out ' +
               workable + '</button>';
    html += '<button class="chip" data-c="" data-w="0" aria-pressed="true">All ' + all.length + '</button>';
    names.forEach(function (n) {
      html += '<button class="chip" data-c="' + esc(n) + '" data-w="0" aria-pressed="false">' +
              esc(n) + ' ' + counts[n] + '</button>';
    });
    catsEl.innerHTML = html;
    catsEl.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      category = chip.getAttribute('data-c') || null;
      onlyWorkable = chip.getAttribute('data-w') === '1';
      shown = PAGE;
      catsEl.querySelectorAll('.chip').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === chip));
      });
      render();
    });
  }

  qEl.addEventListener('input', function () {
    query = qEl.value.trim();
    shown = PAGE;
    render();
  });

  moreEl.addEventListener('click', function () {
    shown += PAGE;
    render();
  });

  try {
    var data = JSON.parse(Android.library());
    all = data.formulas || [];
  } catch (e) {
    subEl.textContent = 'Could not load the formulas.';
    return;
  }
  if (!all.length) { subEl.textContent = 'The library is empty.'; return; }
  buildChips();
  render();
})();
</script>
</body>
</html>
