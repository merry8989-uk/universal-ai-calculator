<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Formulas</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --text:#e6edf3; --muted:#9198a1; --accent:#4f9cf0;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.5;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding-bottom:80px; }

  .top { position:sticky; top:0; z-index:10; background:var(--bg);
         border-bottom:1px solid var(--border); padding:12px 14px 8px; }
  .head { display:flex; align-items:baseline; justify-content:space-between; }
  h1 { font-size:1.25rem; margin:0; }
  .sub { color:var(--muted); font-size:.75rem; }
  .back { color:var(--accent); background:none; border:0; font-size:.9rem; padding:4px 0; }

  input[type=search] { width:100%; margin-top:10px; padding:11px 13px; border-radius:10px;
      border:1px solid var(--border); background:var(--panel); color:var(--text);
      font-size:.95rem; -webkit-appearance:none; }
  input[type=search]:focus { outline:2px solid var(--accent); outline-offset:1px; }

  .chips { display:flex; gap:7px; overflow-x:auto; margin-top:9px; padding-bottom:3px;
           scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:5px 11px; border-radius:999px; border:1px solid var(--border);
          background:var(--panel); color:var(--muted); font-size:.78rem; white-space:nowrap; }
  .chip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.kind[aria-pressed=true] { background:#238636; border-color:#238636; }

  .list { padding:10px 12px 0; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px;
          padding:14px; margin-bottom:10px; }
  .card h2 { font-size:.98rem; margin:0 0 6px; font-weight:600; }
  .peek { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85rem;
          color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { display:flex; gap:8px; align-items:center; margin-top:8px;
          font-size:.72rem; color:var(--muted); flex-wrap:wrap; }
  .badge { padding:1px 8px; border-radius:999px; font-size:.68rem; }
  .badge.calc { color:var(--ok); background:#2ea04322; }
  .badge.ref { color:var(--warn); background:#d2992222; }
  .badge.tool { color:var(--accent); background:#4f9cf022; }

  /* ---- the page for one formula ---- */
  .detail { padding:14px; }
  .detail h1 { font-size:1.15rem; margin:0 0 4px; }
  .detail .cat { color:var(--muted); font-size:.75rem; margin-bottom:12px; }
  .formula { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:1rem;
             background:var(--panel2); border-radius:12px; padding:14px;
             white-space:pre-wrap; word-break:break-word; margin-bottom:12px;
             -webkit-user-select:text; user-select:text; }
  .about { color:var(--muted); font-size:.85rem; margin:0 0 12px; }

  .inputs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .field label { display:block; font-size:.7rem; color:var(--muted); margin-bottom:3px; }
  .field input { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border);
                 background:var(--bg); color:var(--text); font-size:.95rem;
                 font-family:ui-monospace,SFMono-Regular,Menlo,monospace; -webkit-appearance:none; }
  .field input:focus { outline:2px solid var(--accent); outline-offset:1px; }

  .answer { margin-top:12px; border-radius:12px; background:var(--panel2); padding:12px 14px; }
  .answer .label { color:var(--muted); font-size:.72rem; }
  .answer .value { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:1.5rem;
                   color:var(--accent); -webkit-user-select:text; user-select:text; }
  .answer.bad .value { font-size:.9rem; color:var(--bad); }
  .outrow { display:flex; justify-content:space-between; gap:10px; padding:5px 0;
            border-bottom:1px solid var(--border); }
  .outrow:last-child { border-bottom:0; }
  .outrow .k { color:var(--muted); font-size:.8rem; }
  .outrow .v { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.95rem;
               -webkit-user-select:text; user-select:text; }

  .steps { margin:12px 0 0; padding:0; list-style:none; }
  .steps li { display:flex; gap:8px; padding:6px 0; border-top:1px solid var(--border);
              font-size:.82rem; }
  .steps li:first-child { border-top:0; }
  .steps .n { flex:0 0 18px; color:var(--muted); font-size:.72rem; padding-top:2px; }
  .steps .body { flex:1; -webkit-user-select:text; user-select:text; }
  .steps .d { color:var(--muted); font-size:.7rem; display:block; }
  .steps .e { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-word; }
  .steps .r { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); }

  .hint { color:var(--muted); font-size:.72rem; margin-top:10px; }
  .action { display:block; width:100%; margin-top:10px; padding:11px; border-radius:10px;
            border:0; background:var(--accent); color:#fff; font-size:.9rem; font-weight:600; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:.9rem; }
  .more { display:block; width:100%; margin:14px 0 30px; padding:12px; border-radius:10px;
          background:var(--accent); color:#fff; border:0; font-size:.9rem; font-weight:600; }
</style>
</head>
<body>

<div id="indexView">
  <div class="top">
    <div class="head">
      <div>
        <h1>Formulas</h1>
        <div class="sub" id="sub">Loading…</div>
      </div>
      <button class="back" onclick="Android.back()">Back</button>
    </div>
    <input type="search" id="q" placeholder="Search — try cos, Bayes, interest" autocomplete="off">
    <div class="chips" id="kinds"></div>
    <div class="chips" id="cats"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>Nothing matches that search.</div>
  <button class="more" id="more" hidden>Show more</button>
</div>

<div id="detailView" hidden></div>

<script>
(function () {
  'use strict';

  var PAGE = 25;
  var tools = [];
  var refs = [];
  var byId = {};
  var all = [];
  var shown = PAGE;
  var query = '';
  var category = null;
  var kind = 'all';

  var indexView = document.getElementById('indexView');
  var detailView = document.getElementById('detailView');
  var listEl = document.getElementById('list');
  var kindsEl = document.getElementById('kinds');
  var catsEl = document.getElementById('cats');
  var subEl = document.getElementById('sub');
  var emptyEl = document.getElementById('empty');
  var moreEl = document.getElementById('more');
  var qEl = document.getElementById('q');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function num(v) {
    if (v === null || v === undefined || !isFinite(v)) return '—';
    if (Number.isInteger(v) && Math.abs(v) < 1e15) return v.toLocaleString('en-IN');
    var a = Math.abs(v);
    if (a !== 0 && (a < 1e-6 || a >= 1e12)) return v.toExponential(6);
    return v.toLocaleString('en-IN', { maximumFractionDigits: 8 });
  }

  function parse(raw) {
    try { return JSON.parse(raw); } catch (e) { return { ok: false, error: 'The app did not answer.' }; }
  }

  // ---- routing: one page per formula ----

  function go(hash) { location.hash = hash; }

  function route() {
    var h = location.hash || '#/';
    var m = h.match(/^#\/([ft])\/(.+)$/);
    if (m) {
      var item = byId[m[1] + ':' + decodeURIComponent(m[2])];
      if (item) {
        showDetail(item);
        return;
      }
    }
    showIndex();
  }

  function showIndex() {
    detailView.hidden = true;
    indexView.hidden = false;
    render();
  }

  function showDetail(item) {
    indexView.hidden = true;
    detailView.hidden = false;
    detailView.innerHTML = item.kind === 'tool' ? toolPage(item) : refPage(item);
    wireDetail(item);
    window.scrollTo(0, 0);
  }

  // ---- the page for one reference formula ----

  function refPage(f) {
    var workable = f.workable;
    var h = '<div class="top"><div class="head"><div><h1>' + esc(f.title) + '</h1>' +
            '<div class="sub">reference formula</div></div>' +
            '<button class="back" onclick="history.back()">\u2190 Back</button></div></div>';
    h += '<div class="detail">';
    h += '<div class="cat">' + esc(f.category) + '</div>';
    h += '<div class="formula">' + esc(f.printed) + '</div>';
    h += '<div class="meta"><span class="badge ' + (workable ? 'calc' : 'ref') + '">' +
         (workable ? 'works it out' : 'to read') + '</span></div>';

    if (workable) {
      h += '<div class="inputs" style="margin-top:12px">';
      f.inputs.forEach(function (inp) {
        h += '<div class="field"><label>' + esc(inp.label) + '</label>' +
             '<input type="number" step="any" inputmode="decimal" data-k="' + esc(inp.id) +
             '" value="' + inp.sample + '"></div>';
      });
      h += '</div>';
      h += '<div class="answer"><span class="label">' + esc(f.out) +
           (f.unit ? ' (' + esc(f.unit) + ')' : '') + '</span>' +
           '<div class="value">—</div></div>';
      h += '<ol class="steps"></ol>';
      h += '<div class="hint">Hold the formula, the answer or any step to copy or share it.</div>';
    } else if (f.tool) {
      h += '<button class="action" data-goto="#/t/' + encodeURIComponent(f.tool) + '">' +
           'Open the calculator \u2192</button>';
    } else {
      h += '<div class="hint">This one is read, not worked out — it is a rule, a table or a ' +
           'statement rather than a sum.</div>';
    }
    h += '</div>';
    return h;
  }

  // ---- the page for one calculator ----

  function toolPage(f) {
    var h = '<div class="top"><div class="head"><div><h1>' + esc(f.title) + '</h1>' +
            '<div class="sub">calculator</div></div>' +
            '<button class="back" onclick="history.back()">\u2190 Back</button></div></div>';
    h += '<div class="detail">';
    h += '<div class="cat">' + esc(f.category) + '</div>';
    if (f.about) h += '<p class="about">' + esc(f.about) + '</p>';
    h += '<div class="inputs">';
    f.inputs.forEach(function (inp) {
      h += '<div class="field"><label>' + esc(inp.label) + '</label>' +
           '<input type="number" step="any" inputmode="decimal" data-k="' + esc(inp.k) +
           '" value="' + inp.v + '"></div>';
    });
    h += '</div>';
    h += '<div class="answer"><div class="outs"></div></div>';
    h += '<div class="hint">Hold any answer to copy or share it.</div>';
    h += '<button class="action" data-opentool="' + esc(f.id) + '">Open in the calculator tab</button>';
    h += '</div>';
    return h;
  }

  function wireDetail(item) {
    var root = detailView;
    root.querySelectorAll('[data-goto]').forEach(function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-goto')); });
    });
    root.querySelectorAll('[data-opentool]').forEach(function (b) {
      b.addEventListener('click', function () { Android.openTool(b.getAttribute('data-opentool')); });
    });

    if (!item.workable && item.kind !== 'tool') return;
    var run = function () { item.kind === 'tool' ? workTool(root, item) : workRef(root, item); };
    run();
    root.querySelectorAll('input[data-k]').forEach(function (inp) {
      inp.addEventListener('input', run);
    });
  }

  function pairsOf(root) {
    var pairs = [];
    root.querySelectorAll('input[data-k]').forEach(function (inp) {
      pairs.push(encodeURIComponent(inp.getAttribute('data-k')) + '=' +
                 encodeURIComponent(inp.value === '' ? '0' : inp.value));
    });
    return pairs.join('&');
  }

  function workTool(root, f) {
    var r = parse(Android.calculateTool(f.id, pairsOf(root)));
    var box = root.querySelector('.answer');
    var outs = root.querySelector('.outs');
    if (!r.ok) {
      box.classList.add('bad');
      outs.innerHTML = '<div class="value">' + esc(r.error || 'That did not work.') + '</div>';
      return;
    }
    box.classList.remove('bad');
    var h = '';
    (r.outputs || []).forEach(function (o) {
      h += '<div class="outrow"><span class="k">' + esc(o.label) + '</span>' +
           '<span class="v">' + esc(num(o.value) + (o.unit ? ' ' + o.unit : '')) + '</span></div>';
    });
    outs.innerHTML = h;
  }

  function workRef(root, f) {
    var r = parse(Android.calculate(f.id, pairsOf(root)));
    var box = root.querySelector('.answer');
    var val = root.querySelector('.answer .value');
    var steps = root.querySelector('.steps');
    steps.innerHTML = '';

    if (r.ok) {
      box.classList.remove('bad');
      val.textContent = (r.exact || '') + (r.unit ? ' ' + r.unit : '');
    } else {
      box.classList.add('bad');
      val.textContent = r.error || 'That did not work.';
    }

    (r.steps || []).forEach(function (s, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="n">' + (i + 1) + '</span>' +
        '<span class="body"><span class="d">' + esc(s.d) + '</span>' +
        '<span class="e">' + esc(s.e) + '</span>' +
        (s.r ? '<span class="r"> = ' + esc(s.r) + '</span>' : '') +
        '</span>';
      steps.appendChild(li);
    });
    (r.warnings || []).forEach(function (w) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="n">!</span><span class="body"><span class="d">' +
                     esc(w) + '</span></span>';
      steps.appendChild(li);
    });
  }

  // ---- the list ----

  function matches(f) {
    if (kind !== 'all' && f.kind !== kind) return false;
    if (category && f.category !== category) return false;
    if (!query) return true;
    var q = query.toLowerCase();
    var hay = f.kind === 'tool'
      ? (f.title + ' ' + f.about + ' ' + f.category)
      : (f.title + ' ' + f.printed + ' ' + f.category);
    return hay.toLowerCase().indexOf(q) >= 0;
  }

  function listCard(f) {
    var href = f.kind === 'tool'
      ? '#/t/' + encodeURIComponent(f.id)
      : '#/f/' + encodeURIComponent(f.id);
    var peek = f.kind === 'tool' ? (f.about || '') : f.printed;
    var badge = f.kind === 'tool'
      ? '<span class="badge tool">calculator</span>'
      : '<span class="badge ' + (f.workable ? 'calc' : 'ref') + '">' +
        (f.workable ? 'works it out' : 'to read') + '</span>';
    return '<a class="card" href="' + href + '" style="display:block;text-decoration:none;color:inherit">' +
      '<h2>' + esc(f.title) + '</h2>' +
      '<div class="peek">' + esc(peek) + '</div>' +
      '<div class="meta">' + badge + '<span>' + esc(f.category) + '</span></div></a>';
  }

  function render() {
    var filtered = all.filter(matches);
    var slice = filtered.slice(0, shown);
    var html = '';
    for (var i = 0; i < slice.length; i++) html += listCard(slice[i]);
    listEl.innerHTML = html;

    emptyEl.hidden = filtered.length !== 0;
    moreEl.hidden = filtered.length <= shown;
    moreEl.textContent = 'Show more (' + Math.max(0, filtered.length - shown) + ' left)';
    subEl.textContent = filtered.length + ' of ' + all.length +
      (category ? ' · ' + category : '');
  }

  function buildKinds() {
    var h = '<button class="chip kind" data-k="all" aria-pressed="true">Everything ' + all.length + '</button>';
    h += '<button class="chip kind" data-k="tool" aria-pressed="false">Calculators ' + tools.length + '</button>';
    h += '<button class="chip kind" data-k="ref" aria-pressed="false">Reference ' + refs.length + '</button>';
    kindsEl.innerHTML = h;
    kindsEl.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      kind = chip.getAttribute('data-k');
      shown = PAGE;
      kindsEl.querySelectorAll('.chip').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === chip));
      });
      buildCats();
      render();
    });
  }

  function buildCats() {
    var counts = {};
    all.forEach(function (f) {
      if (kind !== 'all' && f.kind !== kind) return;
      counts[f.category] = (counts[f.category] || 0) + 1;
    });
    var names = Object.keys(counts).sort();
    var h = '<button class="chip" data-c="" aria-pressed="true">All</button>';
    names.forEach(function (n) {
      h += '<button class="chip" data-c="' + esc(n) + '" aria-pressed="false">' +
           esc(n) + ' ' + counts[n] + '</button>';
    });
    catsEl.innerHTML = h;
    category = null;
    catsEl.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      category = chip.getAttribute('data-c') || null;
      shown = PAGE;
      catsEl.querySelectorAll('.chip').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === chip));
      });
      render();
    });
  }

  qEl.addEventListener('input', function () {
    query = qEl.value.trim();
    shown = PAGE;
    render();
  });

  moreEl.addEventListener('click', function () {
    shown += PAGE;
    render();
  });

  window.addEventListener('hashchange', route);

  // ---- load ----

  try {
    tools = (parse(Android.tools()).tools || []).map(function (t) {
      t.kind = 'tool';
      byId['t:' + t.id] = t;
      return t;
    });
    refs = (parse(Android.library()).formulas || []).map(function (r) {
      r.kind = 'ref';
      byId['f:' + r.id] = r;
      return r;
    });
    all = tools.concat(refs);
  } catch (e) {
    subEl.textContent = 'Could not load the formulas.';
    return;
  }
  if (!all.length) { subEl.textContent = 'The library is empty.'; return; }
  buildKinds();
  buildCats();
  route();
})();
</script>
</body>
</html>
