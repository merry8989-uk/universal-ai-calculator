rial": 69, "title": "Compound interest (annual)", "category": "Algebra", "formula": "A = P(1 + r)ᵗ"}, {"serial": 70, "title": "Effective annual rate", "category": "Algebra", "formula": "EAR = (1 + r/n)ⁿ − 1"}, {"serial": 71, "title": "Present value", "category": "Algebra", "formula": "PV = FV / (1 + r)ᵗ"}, {"serial": 72, "title": "Sine rule", "category": "Geometry", "formula": "a / sin A = b / sin B = c / sin C = 2R"}, {"serial": 73, "title": "Angle bisector length", "category": "Geometry", "formula": "lₐ = √(bc[1 − a²/(b + c)²])"}, {"serial": 74, "title": "Exterior angles of a polygon", "category": "Geometry", "formula": "Sum of exterior angles = 360°"}, {"serial": 75, "title": "Square: area, perimeter and diagonal", "category": "Geometry", "formula": "A = a²,  P = 4a,  diagonal = a√2"}, {"serial": 76, "title": "Similar figures", "category": "Geometry", "formula": "Areas scale as k², volumes as k³"}, {"serial": 77, "title": "Euler's polyhedron formula", "category": "Geometry", "formula": "V − E + F = 2"}, {"serial": 78, "title": "Pythagorean identity", "category": "Trigonometry", "formula": "sin²θ + cos²θ = 1"}, {"serial": 79, "title": "Secant identity", "category": "Trigonometry", "formula": "1 + tan²θ = sec²θ"}, {"serial": 80, "title": "Cosecant identity", "category": "Trigonometry", "formula": "1 + cot²θ = csc²θ"}, {"serial": 81, "title": "Tangent as a ratio", "category": "Trigonometry", "formula": "tan θ = sin θ / cos θ"}, {"serial": 82, "title": "Cotangent as a ratio", "category": "Trigonometry", "formula": "cot θ = cos θ / sin θ"}, {"serial": 83, "title": "Secant and cosecant", "category": "Trigonometry", "formula": "sec θ = 1 / cos θ,  csc θ = 1 / sin θ"}, {"serial": 84, "title": "Sine of a sum", "category": "Trigonometry", "formula": "sin(A + B) = sin A cos B + cos A sin B"}, {"serial": 85, "title": "Sine of a difference", "category": "Trigonometry", "formula": "sin(A − B) = sin A cos B − cos A sin B"}, {"serial": 86, "title": "Cosine of a sum", "category": metry", "formula": "A x² + B xy + C y² + D x + E y + F = 0"}, {"serial": 181, "title": "Conic classification", "category": "Analytic Geometry", "formula": "B² − 4AC < 0 ellipse, = 0 parabola, > 0 hyperbola"}, {"serial": 182, "title": "Plane in 3-D", "category": "Analytic Geometry", "formula": "A x + B y + C z + D = 0"}, {"serial": 183, "title": "Direction ratios of a line", "category": "Analytic Geometry", "formula": "x = x₁ + a t,  y = y₁ + b t,  z = z₁ + c t"}, {"serial": 184, "title": "Angle between two lines (3-D)", "category": "Analytic Geometry", "formula": "cos θ = (a₁a₂ + b₁b₂ + c₁c₂) / (√(a₁² + b₁² + c₁²) √(a₂² + b₂² + c₂²))"}, {"serial": 185, "title": "Limit of a sum", "category": "Differential Calculus", "formula": "lim (f + g) = lim f + lim g"}, {"serial": 186, "title": "Limit of a product", "category": "Differential Calculus", "formula": "lim (f · g) = lim f · lim g"}, {"serial": 187, "title": "L'Hôpital's rule", "category": "Differential Calculus", "formula": "lim (f/g) = lim (f'/g')"}, {"serial": 188, "title": "Power rule", "category": "Differential Calculus", "formula": "d/dx xⁿ = n xⁿ⁻¹"}, {"serial": 189, "title": "Constant rule", "category": "Differential Calculus", "formula": "d/dx c = 0"}, {"serial": 190, "title": "Constant multiple", "category": "Differential Calculus", "formula": "d/dx (c f) = c f′"}, {"serial": 191, "title": "Sum rule", "category": "Differential Calculus", "formula": "d/dx (f + g) = f′ + g′"}, {"serial": 192, "title": "Product rule", "category": "Differential Calculus", "formula": "d/dx (f g) = f′g + f g′"}, {"serial": 193, "title": "Quotient rule", "category": "Differential Calculus", "formula": "d/dx (f / g) = (f′g − f g′) / g²"}, {"serial": 194, "title": "Chain rule", "category": "Differential Calculus", "formula": "d/dx f(g(x)) = f′(g(x)) · g′(x)"}, {"serial": 195, "title": "Derivative of sine", "category": "Differential Calculus", "formula": "d/dx sin x = cos x"}, {"serial": 196, "title": "Derivative of cosine", "category ential", "category": "Integral Calculus", "formula": "∫ eˣ dx = eˣ + C"}, {"serial": 228, "title": "General exponential", "category": "Integral Calculus", "formula": "∫ aˣ dx = aˣ / ln a + C"}, {"serial": 229, "title": "Sine", "category": "Integral Calculus", "formula": "∫ sin x dx = −cos x + C"}, {"serial": 230, "title": "Cosine", "category": "Integral Calculus", "formula": "∫ cos x dx = sin x + C"}, {"serial": 231, "title": "Tangent", "category": "Integral Calculus", "formula": "∫ tan x dx = ln|sec x| + C"}, {"serial": 232, "title": "Cotangent", "category": "Integral Calculus", "formula": "∫ cot x dx = ln|sin x| + C"}, {"serial": 233, "title": "Secant", "category": "Integral Calculus", "formula": "∫ sec x dx = ln|sec x + tan x| + C"}, {"serial": 234, "title": "Cosecant", "category": "Integral Calculus", "formula": "∫ csc x dx = ln|csc x − cot x| + C"}, {"serial": 235, "title": "Secant squared", "category": "Integral Calculus", "formula": "∫ sec²x dx = tan x + C"}, {"serial": 236, "title": "Cosecant squared", "category": "Integral Calculus", "formula": "∫ csc²x dx = −cot x + C"}, {"serial": 237, "title": "Arc tangent", "category": "Integral Calculus", "formula": "∫ dx / (1 + x²) = tan⁻¹x + C"}, {"serial": 238, "title": "Arc sine", "category": "Integral Calculus", "formula": "∫ dx / √(1 − x²) = sin⁻¹x + C"}, {"serial": 239, "title": "With a squared denominator", "category": "Integral Calculus", "formula": "∫ dx / (x² + a²) = (1/a) tan⁻¹(x/a) + C"}, {"serial": 240, "title": "With a squared root", "category": "Integral Calculus", "formula": "∫ dx / √(x² ± a²) = ln|x + √(x² ± a²)| + C"}, {"serial": 241, "title": "With a difference of squares", "category": "Integral Calculus", "formula": "∫ dx / (x² − a²) = (1/2a) ln|(x − a)/(x + a)| + C"}, {"serial": 242, "title": "Logarithm", "category": "Integral Calculus", "formula": "∫ ln x dx = x ln x − x + C"}, {"serial": 243, "title": "Sine squared", "category": "Integral Calculus", "formula": "∫ sin²x dx = x/2 − sin 2x / 4 + C" const greek={'α':'alpha','β':'beta','γ':'gamma','δ':'delta','ε':'epsilon','θ':'theta','λ':'lambda','μ':'mu','π':'pi','ρ':'rho','σ':'sigma','τ':'tau','φ':'phi','ω':'omega','Δ':'Delta','Σ':'Sigma','Γ':'Gamma','Ω':'Omega','∞':'Infinity'};
function symbolsIn(formula){let s=formula;const skip=new Set(['sin','cos','tan','cot','sec','csc','ln','log','lim','max','min','or','and','if','d','dx','dt','nCr']);let tokens=s.match(/[A-Za-z]+|[α-ωΑ-Ω]|[₀-₉]+/g)||[];let out=[];tokens.forEach(t=>{if(!skip.has(t)&&!out.includes(t)&&!/^[0-9]+$/.test(t))out.push(t)});return out.slice(0,24)}
function simpleExpr(f){let s=f.formula;let eq=s.indexOf('=');if(eq>=0)s=s.slice(eq+1);s=s.trim();
s=s.replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/·/g,'*').replace(/π/g,'pi').replace(/√\(([^()]*)\)/g,'sqrt($1)').replace(/√([A-Za-z0-9]+)/g,'sqrt($1)').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\^\\?\\?\{([^}]+)\}/g,'^($1)').replace(/\^\(([^()]*)\)/g,'^($1)');
for(const [k,v] of Object.entries(greek))s=s.split(k).join(v);
s=s.replace(/\s+/g,' ').trim();return s}

function calculate(vars){try{if(!window.math)throw Error('Math.js load nahi hua. Internet connection check karein.');let scope={};let missing=[];vars.forEach((v,i)=>{let el=$('v_'+i);if(!el)return;let val=el.value;if(val==='' ){if(!['pi','e'].includes(v))missing.push(v);return}let key=Object.keys(greek).includes(v)?greek[v]:v;scope[key]=Number(val)});if(missing.length)throw Error('In rashi ki value dein: '+missing.join(', '));let result=math.evaluate($('calcExpr').value,scope);$('calcResult').textContent='Result: '+(typeof result==='number'?math.format(result,{precision:14}):String(result))+'\\nUsed values: '+JSON.stringify(scope)}catch(e){$('calcResult').textContent='Calculation nahi ho payi: '+e.message}}
